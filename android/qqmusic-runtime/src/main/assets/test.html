<!DOCTYPE html><html><head>    <title></title></head><body><button id="play">play</button><button id="pause">pause</button><button id="getState">getState</button><button id="pushtips">pushtips</button></body><script>    var bridge=WebViewJavascriptBridge;    bridge.audio={};    bridge.audio.onplay=function(data){        alert("onplay: "+JSON.stringify(data));    }    bridge.audio.onpause=function(data){        alert("onpause: "+JSON.stringify(data));    }    bridge.audio.trigger=function(method,data){        try{           this['on'+method](data);        }catch(e){            alert(e);        }    }    var playBtn=document.getElementById("play");    var pauseBtn=document.getElementById("pause");    var stateBtn=document.getElementById("getState");    var aaaBtn=document.getElementById("aaaBtn");    var pushtipsBtn=document.getElementById("pushtips");    function echo(args){        alert(args);    }    function sum(data){        alert(data.name);        alert("sum"+(1+data.count)*data.count/2);    }    playBtn.addEventListener("click",function(){       bridge.callHandler('audio.play',{songId:[7060463,5520746,5923992]},function(data){            alert("call native play: "+JSON.stringify(data));       });    },false);    pauseBtn.addEventListener("click",function(){       bridge.callHandler('audio.pause',{name:"chunxiao"}, function (data) {            alert("call native pause: "+JSON.stringify(data));	   });    },false);    stateBtn.addEventListener("click",function(){       bridge.callHandler('audio.getState',null, function (data) {            alert("call native getState: "+JSON.stringify(data));	   });    },false);    pushtipsBtn.addEventListener("click",function(){       bridge.callHandler('tipsCenter',{"data":[{"id":1333,"url":"http://www.qq.com"}]},function (data) {            alert("call native aaa: "+JSON.stringify(data));	   });    },false);</script></html>
