def mengzhenLocalProperties = new Properties()
def mengzhenLocalPropertiesFile = rootProject.file('local.properties')
if (mengzhenLocalPropertiesFile.exists()) {
    mengzhenLocalPropertiesFile.withInputStream { mengzhenLocalProperties.load(it) }
}
def mengzhenWechatAppId = (System.getenv('WECHAT_APP_ID')
        ?: mengzhenLocalProperties.getProperty('WECHAT_APP_ID', '')).trim()
if (mengzhenWechatAppId && !(mengzhenWechatAppId ==~ /wx[0-9A-Za-z]+/)) {
    throw new GradleException('WECHAT_APP_ID must be a valid WeChat Open Platform AppID')
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.mengzhen.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.mengzhen.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "WECHAT_APP_ID", "\"${mengzhenWechatAppId}\""
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // QQ 音乐原始字节码内联了完整资源表的整数 ID。
            additionalParameters "--stable-ids", file("qqmusic-runtime-stable-ids.txt").absolutePath
        }
    }

    signingConfigs {
        release {
            storeFile file('mengzhen-release.jks')
            storePassword 'mengzhen2026'
            keyAlias 'mengzhen'
            keyPassword 'mengzhen2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // These layouts are copied verbatim from Ximalaya 9.4.95.3. Several controls are
        // positioned by the source adapters at runtime and intentionally use platform tint.
        // Rewriting them only to satisfy static XML style checks would break source fidelity.
        disable 'MissingConstraints', 'UseAppTint'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':qqmusic-runtime')
    
    // AndroidX core
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation("androidx.constraintlayout:constraintlayout:2.1.4") {
        version { strictly "2.1.4" }
    }
    implementation("androidx.constraintlayout:constraintlayout-core:1.0.4") {
        version { strictly "1.0.4" }
    }
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation("androidx.preference:preference:1.2.1") {
        // qqmusic-runtime already embeds these exact AndroidX classes.
        exclude group: "androidx.fragment", module: "fragment-ktx"
        exclude group: "androidx.slidingpanelayout", module: "slidingpanelayout"
    }
    implementation "androidx.viewpager:viewpager:1.1.0"
    implementation "androidx.palette:palette-ktx:1.0.0"
    implementation "com.google.android.material:material:1.14.0"

    // Jetpack Compose (BOM ensures consistent versions)
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.animation:animation"
    
    // Navigation
    implementation "androidx.navigation:navigation-compose:2.9.8"
    
    // Networking
    implementation "com.squareup.okhttp3:okhttp:5.4.0"
    implementation "org.json:json:20260719"
    
    // Media
    implementation "androidx.media:media:1.8.0"
    implementation "androidx.media3:media3-exoplayer:1.10.1"
    implementation "androidx.media3:media3-ui:1.10.1"
    implementation "androidx.media3:media3-session:1.10.1"
    implementation "androidx.media3:media3-datasource:1.10.1"

    // 喜马拉雅 9.4.95.3 播放控制区使用的原始 Lottie 动画。
    implementation "com.airbnb.android:lottie:6.7.1"
    // QQ 音乐播放列表当前项使用的原始 PAG 动画运行时。

    // Image loading
    implementation "io.coil-kt.coil3:coil:3.5.0"
    implementation "io.coil-kt.coil3:coil-compose:3.5.0"
    implementation "io.coil-kt.coil3:coil-network-okhttp:3.5.0"
    
    // DataStore for preferences
    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation "androidx.documentfile:documentfile:1.1.0"

    // Shizuku/Sui provides the optional shell/root bridge used to read Bilibili's
    // app-specific cache directory on scoped-storage devices.
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "com.github.topjohnwu.libsu:service:6.0.0"
    
    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    // 搜索页语音输入。沿用 Vosk 官方 Android 示例的固定版本与 JNA 运行时；
    // 中文模型随 APK 内置，设备无需提供系统 RecognitionService。
    implementation "net.java.dev.jna:jna:5.19.1@aar"
    implementation "com.alphacephei:vosk-android:0.3.75@aar"
    
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
