ext {
    minSdkVersion = 31
    compileSdkVersion = 37
    // The bundled QQ Music 20.6 runtime still uses the pre-Android-13
    // dynamic receiver contract in its MainService. Keep the host target at
    // the last compatible level so the imported service can initialize on
    // Android 15 without a SecurityException before the native pages load.
    targetSdkVersion = 32
    androidxActivityVersion = '1.13.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.19.0'
    androidxFragmentVersion = '1.9.0'
    coreSplashScreenVersion = '1.2.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
}
